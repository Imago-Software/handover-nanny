name: Repository handover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Handover mode
        required: true
        type: choice
        options:
          - finish
          - start

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Analyse handover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDOVER_MODE: ${{ inputs.mode }}
        run: python3 src/cli.py --mode "$HANDOVER_MODE"
